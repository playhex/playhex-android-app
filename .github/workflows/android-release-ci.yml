name: Android Release CI

on:
  push:
    tags:
      - "*"
      - "!nightly*"

jobs:
  build:
    name: Build, Sign & Release
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: Checkout project
        uses: actions/checkout@v4.2.2

      - name: set up JDK 17
        uses: actions/setup-java@v4.7.1
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - uses: actions/cache@v4.2.3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean && ./gradlew assembleRelease

      - name: Sign APK
        uses: ilharp/sign-android-release@v2.0.0
        # ID used to access action output
        id: sign_app
        with:
          signingKey: ${{ secrets.SIGNING_KEY }}
          keyAlias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Release to GitHub
        uses: svenstaro/upload-release-action@2.11.1
        with:
          file: ${{steps.sign_app.outputs.signedFile}}
          asset_name: PlayHex-${{ github.ref_name }}-signed.apk
          overwrite: true

      - name: Build and sign AAB (Google Play)
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease
          echo "$SIGNING_KEY" | base64 -d > "$RUNNER_TEMP/release.keystore"
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore "$RUNNER_TEMP/release.keystore" \
            -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
            -signedjar PlayHex-signed.aab \
            app/build/outputs/bundle/release/app-release.aab \
            "$KEY_ALIAS"
          rm "$RUNNER_TEMP/release.keystore"
          # fails if not signed
          unzip -l PlayHex-signed.aab | grep -E "META-INF/.*\.(RSA|EC|DSA)$"
          # compare with upload key certificate in Play Console > App integrity
          keytool -printcert -jarfile PlayHex-signed.aab | grep -E "SHA1|SHA256"

      - name: Release AAB to GitHub
        uses: svenstaro/upload-release-action@2.11.1
        with:
          file: PlayHex-signed.aab
          asset_name: PlayHex-${{ github.ref_name }}-signed.aab
          overwrite: true
